[package]
name = "parse_message"
version.workspace = true
authors.workspace = true
description = "Parse Discord messages"
edition.workspace = true
repository.workspace = true
license-file.workspace = true

[lib]
# This crate is distributed only as WebAssembly. Tests live inside the crate so
# release builds can produce a single crate type and retain LTO.
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
html_to_markdown = { path = "../html_to_markdown" }
discord_message_sender_core = { path = "../discord_message_sender_core" }
js-sys.workspace = true
wasm-bindgen.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
tsify.workspace = true
