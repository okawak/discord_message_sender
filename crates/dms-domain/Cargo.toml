[package]
name = "dms-domain"
publish = false
version.workspace = true
authors.workspace = true
description = "Domain logic for Discord Message Sender"
edition.workspace = true
repository.workspace = true
license-file.workspace = true

[dependencies]
thiserror.workspace = true
regex-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true
jiff.workspace = true

# Native checks use IANA/Unicode data without requiring a JavaScript host.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
jiff = { workspace = true, features = ["tzdb-zoneinfo"] }

[target.'cfg(windows)'.dependencies]
jiff = { workspace = true, features = ["tzdb-bundle-platform"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
