[package]
name = "dms-wasm"
publish = false
version.workspace = true
authors.workspace = true
description = "WebAssembly bindings for Discord Message Sender"
edition.workspace = true
repository.workspace = true
license-file.workspace = true

[lib]
# This crate is distributed only as WebAssembly. dms-domain tests live in their own
# crate so release builds can produce a single crate type and retain LTO.
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
dms-domain = { path = "../dms-domain" }
js-sys.workspace = true
wasm-bindgen.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
tsify.workspace = true
