name: Publish Plugin Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Validate publication request
        run: |
          if [[ "$GITHUB_REF" != "refs/tags/$VERSION" ]]; then
            echo "::error::Run this workflow from the release tag $VERSION."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must use the x.y.z format without a v prefix."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release commit
        run: |
          git fetch --tags origin
          TAG_SHA="$(git rev-parse "refs/tags/$VERSION^{}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          EXPECTED_MESSAGE="chore: release $VERSION"
          ACTUAL_MESSAGE="$(git log -1 --format=%s)"
          test "$TAG_SHA" = "$HEAD_SHA"
          test "$PACKAGE_VERSION" = "$VERSION"
          test "$MANIFEST_VERSION" = "$VERSION"
          test "$CARGO_VERSION" = "$VERSION"
          test "$ACTUAL_MESSAGE" = "$EXPECTED_MESSAGE"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1
          target: wasm32-unknown-unknown
          cache-workspaces: |
            .

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit Bun dependencies
        run: bun audit

      - name: Check plugin
        run: |
          bun run type-check
          bun run check
          bun run test

      - name: Build plugin
        run: bun run build

      - name: Test WASM bindings
        run: bun run test:wasm

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
          create-storage-record: false

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/manifest.json
            dist/main.js
          draft: false
          fail_on_unmatched_files: true
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
