name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-workspaces: |
            .

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
          checksum: true
          fallback: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit Bun dependencies
        run: bun audit

      - name: Build
        run: bun run build

      - name: Verify reproducible release assets
        run: bun run verify:build

      - name: Verify build with a fresh Rust installation
        env:
          RUSTUP_HOME: ${{ runner.temp }}/discord-cold-rustup
          CARGO_TARGET_DIR: ${{ runner.temp }}/discord-cold-target
        run: |
          unset RUSTUP_TOOLCHAIN
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          sha256sum dist/main.js dist/manifest.json > "$RUNNER_TEMP/discord-cold-build.sha256"
          bun run build
          sha256sum --check "$RUNNER_TEMP/discord-cold-build.sha256"

      - name: Verify lockfiles are unchanged
        run: git diff --exit-code -- bun.lock Cargo.lock

      - name: Type check
        run: bun run type-check

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Test WASM bindings
        run: bun run test:wasm
