name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix (for example, 0.4.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Validate release request
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must use the x.y.z format without a v prefix."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/tags/$VERSION" ]]; then
            echo "::error::Run this workflow from main or the release tag $VERSION."
            exit 1
          fi

  prepare-release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate existing tag
        run: |
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            TAG_SHA="$(git rev-parse "refs/tags/$VERSION^{}")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              echo "::error::Tag $VERSION already points to $TAG_SHA instead of current main $HEAD_SHA."
              exit 1
            fi
          fi

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-workspaces: |
            .

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
          checksum: true
          fallback: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit Bun dependencies
        run: bun audit

      - name: Prepare release version
        run: bun scripts/prepare-release.ts "$VERSION"

      - name: Verify release version
        run: |
          PACKAGE_VERSION="$(bun -e "const p = await Bun.file('package.json').json(); console.log(p.version)")"
          MANIFEST_VERSION="$(bun -e "const p = await Bun.file('manifest.json').json(); console.log(p.version)")"
          CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          MIN_APP_VERSION="$(bun -e "const versions = await Bun.file('versions.json').json(); console.log(versions[process.env.VERSION] ?? '')")"
          test "$PACKAGE_VERSION" = "$VERSION"
          test "$MANIFEST_VERSION" = "$VERSION"
          test "$CARGO_VERSION" = "$VERSION"
          test -n "$MIN_APP_VERSION"

      - name: Build plugin
        run: bun run build

      - name: Check plugin
        run: |
          bun run type-check
          bun run check
          bun run test

      - name: Test WASM bindings
        run: bun run test:wasm

      - name: Commit release version
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json Cargo.toml Cargo.lock versions.json

          if git diff --cached --quiet; then
            EXPECTED_MESSAGE="chore: release $VERSION"
            ACTUAL_MESSAGE="$(git log -1 --format=%s)"
            if [[ "$ACTUAL_MESSAGE" != "$EXPECTED_MESSAGE" ]]; then
              echo "::error::Version files already contain $VERSION, but current main is not its release commit."
              exit 1
            fi
            echo "Reusing the existing release commit for $VERSION."
          else
            git commit -m "chore: release $VERSION"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
        run: |
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            TAG_SHA="$(git rev-parse "refs/tags/$VERSION^{}")"
            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "::error::Tag $VERSION already points to $TAG_SHA instead of $RELEASE_SHA."
              exit 1
            fi
            echo "Tag $VERSION already points to the release commit."
          else
            git tag -a "$VERSION" -m "Release $VERSION" "$RELEASE_SHA"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERSION"
          fi

      - name: Dispatch release publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VERSION" \
            -f "version=$VERSION"

  publish-release:
    needs: validate
    if: github.ref == format('refs/tags/{0}', inputs.version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release commit
        run: |
          git fetch --tags origin
          TAG_SHA="$(git rev-parse "refs/tags/$VERSION^{}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          EXPECTED_MESSAGE="chore: release $VERSION"
          ACTUAL_MESSAGE="$(git log -1 --format=%s)"
          test "$TAG_SHA" = "$HEAD_SHA"
          test "$PACKAGE_VERSION" = "$VERSION"
          test "$MANIFEST_VERSION" = "$VERSION"
          test "$CARGO_VERSION" = "$VERSION"
          test "$ACTUAL_MESSAGE" = "$EXPECTED_MESSAGE"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-workspaces: |
            .

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
          checksum: true
          fallback: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit Bun dependencies
        run: bun audit

      - name: Build plugin
        run: bun run build

      - name: Check plugin
        run: |
          bun run type-check
          bun run check
          bun run test

      - name: Test WASM bindings
        run: bun run test:wasm

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
          create-storage-record: false

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/manifest.json
            dist/main.js
          draft: false
          fail_on_unmatched_files: true
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
