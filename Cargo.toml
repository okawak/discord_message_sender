[workspace]
members = [
  "crates/domain",
  "crates/parse_message",
]
resolver = "3"

[workspace.package]
version = "0.5.2"
authors = ["okawak"]
description = "Send messages to Obsidian from Discord."
edition = "2024"
repository = "https://github.com/okawak/discord_message_sender"
license-file = "LICENSE"

[workspace.dependencies]
thiserror = "2"
regex-lite = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
